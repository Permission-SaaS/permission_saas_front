# Serve o build do Vite (dist/) e repassa a API, como o proxy do vite.config.ts faz em desenvolvimento.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Fallback da SPA: um caminho que não é arquivo nem pasta (ex.: /projects/123) devolve o index.html,
    # e o React Router resolve a rota no navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy da API: a barra no fim do proxy_pass tira o prefixo /api (/api/projects chega como /projects).
    # permission-service é o nome do serviço no docker-compose.yml do umbrella.
    location /api/ {
        proxy_pass http://permission-service:8080/;
    }
}
